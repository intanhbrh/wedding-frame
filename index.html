<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sarah &amp; Adam's Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Dancing+Script:wght@600&family=Great+Vibes&family=Parisienne&family=Pinyon+Script&family=Playfair+Display:ital@1&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Welcome screen -->
  <section id="splash">
    <div class="splash-card">
      <p class="small">You're invited to capture</p>
      <h1 class="script">Sarah &amp; Adam</h1>
      <p class="date">12 December 2026</p>
      <div class="divider">✦</div>
      <p class="hint">Snap a photo, pick a frame, add your wishes and share it to your story</p>
      <button id="start" class="primary">Start 📸</button>
    </div>
  </section>

  <!-- Main app -->
  <main id="app" hidden>
    <header>
      <h2 class="script">Sarah &amp; Adam</h2>
      <button id="music" class="icon" aria-label="Toggle music">🎵</button>
    </header>

    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="photo" alt="" hidden />
      <img id="frameOverlay" src="frames/frame1.png" alt="" />
      <div id="textOverlay" class="text-overlay"></div>
      <div id="countdown" hidden></div>
    </div>

    <!-- Camera buttons -->
    <div class="buttons" id="live">
      <button id="snap" class="primary">📸 Snap</button>
      <label class="btn">🖼️ Gallery
        <input type="file" id="file" accept="image/*" hidden />
      </label>
      <button id="flip">🔄 Flip</button>
    </div>

    <!-- After photo buttons -->
    <div class="buttons" id="after" hidden>
      <button id="share" class="primary">Share to Story</button>
      <button id="save">Save</button>
      <button id="retake">Retake</button>
    </div>

    <!-- Frames -->
    <div class="card">
      <h3>Frames</h3>
      <div class="frames" id="frames">
        <img src="frames/frame1.png" class="frame-thumb active" data-src="frames/frame1.png" alt="Frame 1" />
        <!-- add more here later:
        <img src="frames/frame2.png" class="frame-thumb" data-src="frames/frame2.png" alt="Frame 2" /> -->
      </div>
    </div>

    <!-- Text -->
    <div class="card">
      <h3>Add your wishes ✍️</h3>
      <textarea id="msg" rows="2" placeholder="Type your wish... (drag the text on the photo to move it)">Forever begins today 💕</textarea>

      <div class="fonts" id="fonts">
        <button class="font-chip active" data-font="Great Vibes" style="font-family:'Great Vibes'">Forever</button>
        <button class="font-chip" data-font="Allura" style="font-family:'Allura'">Forever</button>
        <button class="font-chip" data-font="Dancing Script" style="font-family:'Dancing Script'">Forever</button>
        <button class="font-chip" data-font="Parisienne" style="font-family:'Parisienne'">Forever</button>
        <button class="font-chip" data-font="Pinyon Script" style="font-family:'Pinyon Script'">Forever</button>
        <button class="font-chip" data-font="Playfair Display" style="font-family:'Playfair Display';font-style:italic">Forever</button>
      </div>

      <div class="row">
        <span>Colour</span>
        <div class="swatches" id="swatches">
          <button class="swatch active" data-color="#ffffff" style="background:#ffffff"></button>
          <button class="swatch" data-color="#d4af37" style="background:#d4af37"></button>
          <button class="swatch" data-color="#f4b6c2" style="background:#f4b6c2"></button>
          <button class="swatch" data-color="#4a3b32" style="background:#4a3b32"></button>
          <button class="swatch" data-color="#8b1e3f" style="background:#8b1e3f"></button>
        </div>
      </div>

      <div class="row">
        <span>Size</span>
        <input type="range" id="size" min="50" max="220" value="120" />
      </div>
    </div>

    <p class="footer">Made with love 🤍 by the bride's little sister</p>
  </main>

  <audio id="bgm" src="music/song.mp3" loop preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
